name: Dev to QA

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests on dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: unit-tests
    environment:
      name: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build QA artifact
        run: PYTHONPATH=src python scripts/build_site.py --environment qa --output site

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-site
          path: site

  qa-smoke-tests:
    name: QA smoke tests
    runs-on: ubuntu-latest
    needs: deploy-qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QA artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-site
          path: site

      - name: Validate QA deployment
        run: python scripts/smoke_test.py --environment qa --site site
