name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: "Nota corta para identificar la promocion"
        required: false
        default: "Promocion manual desde QA"

permissions:
  contents: read

jobs:
  production-tests:
    name: Re-run tests before production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: production-tests
    environment:
      name: production
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build production artifact
        run: PYTHONPATH=src python scripts/build_site.py --environment production --output site

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: site

      - name: Production smoke tests
        run: python scripts/smoke_test.py --environment production --site site
